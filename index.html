<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#d17a4a">
<title>IRIAMイベント管理ツール</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%81%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="save-error-banner" class="save-error-banner" role="alert" hidden></div>

<header class="app-header">
  <h1>IRIAMイベント管理ツール</h1>
  <div class="event-switcher">
    <select id="event-select"></select>
    <button id="new-event-btn" class="btn-secondary" type="button">＋ 新規イベント</button>
  </div>
  <div class="header-actions">
    <button id="export-btn" class="btn-secondary" type="button">エクスポート</button>
    <label class="btn-secondary file-label">
      インポート
      <input id="import-input" type="file" accept="application/json" hidden>
    </label>
  </div>
</header>

<nav class="tab-nav">
  <a class="tab-link" data-route="dashboard" href="#/dashboard">ダッシュボード</a>
  <a class="tab-link" data-route="users" href="#/users">ユーザー</a>
  <a class="tab-link" data-route="gifts" href="#/gifts">ギフトマスタ</a>
</nav>

<main id="app"></main>

<footer class="app-footer">
  <p>本ツールは個人が制作した<strong>非公式</strong>のファンツールです。株式会社IRIAM および IRIAM 運営とは一切関係ありません。</p>
  <p>記録したデータ(ユーザー名・メモ・ギフト履歴・企画の設定)はブラウザ内にのみ保存され、外部へ送信されません。ただしパネル画像に外部URLを設定した場合だけは、URL自体がリクエスト先になり、配信元にアクセス元の情報が渡ります。</p>
</footer>

<div id="modal-root"></div>
<div id="dialog-root"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
